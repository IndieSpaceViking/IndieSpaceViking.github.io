<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.css">

  {% seo %}

  <style>
    .navbar {
      display: flex;
      justify-content: center; /* Centers navbar items horizontally */
      align-items: center;
      flex-wrap: wrap;
      background-color: #111;
      margin-top: 10px;
      border-radius: 4px;
      gap: 10px;
    }

    }

    .navbar a,
    .dropbtn {
      float: left;
      font-size: 16px;
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      background-color: inherit;
      border: none;
      outline: none;
    }

    .navbar a:hover,
    .dropdown:hover .dropbtn {
      background-color: #008060;
    }

    .dropdown {
      position: relative; /* Make dropdown content position relative to this */
      display: inline-block;
    }
    
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%; /* Positions the dropdown *below* the button */
      left: 0;
      background-color: #202020;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
      z-index: 999;
    }


    .dropdown-content a {
      color: white;
      padding: 10px 14px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #4666FF;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    header {
      text-align: center;
      padding: 1em 0;
      background-color: #111;
      color: white;
    }

    header h1 {
      margin: 0;
    }

    header h2 {
      font-weight: 300;
      font-size: 1.2rem;
      margin-top: 0.3em;
      color: #ccc;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <a id="a-title" href="{{ '/' | relative_url }}">
        <h1>{{ site.title | default: site.github.repository_name }}</h1>
      </a>
      <h2>{{ site.description | default: site.github.project_tagline }}</h2>
    </div>

    <nav class="navbar container">
      <div class="dropdown">
        <button class="dropbtn">Project <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="https://indiespaceviking.github.io/StellarExplorers/">StellarExplorers</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="dropbtn">Writeups <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="https://indiespaceviking.github.io/thm/">TryHackMe, THM</a>
        </div>
      </div>

      <div class="dropdown">
        <button class="dropbtn">Review <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="https://indiespaceviking.github.io/Tools/">Tools</a>
        </div>
      </div>

      <a href="https://indiespaceviking.github.io/donate">Donate</a>
    </nav>
  </header>

  <main class="container">
    <section id="main_content">
      {{ content }}
    </section>
  </main>

  {% if site.google_analytics %}
  <!-- Google Analytics (Universal Analytics is deprecated) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</body>
</html>
