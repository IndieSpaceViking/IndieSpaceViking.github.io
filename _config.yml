# Site Settings
url: "https://indiespaceviking.github.io"
baseurl: ""  # Leave blank if hosted at root of the GitHub Pages site
title: "Planet Viking"
description: "IndieSpaceViking's official hub for cybersecurity, CTF write-ups, electronics tutorials, and space-age creativity."
name: &name "IndieSpaceViking"
lang: "en"
timezone: "UTC"
show_downloads: false
theme: jekyll-theme-midnight
google_analytics: YOUR-GA-TRACKING-ID  # Replace with your actual Google Analytics ID

# GitHub Settings
#github:
#  is_project_page: false
#  repository_url: "https://github.com/IndieSpaceViking"

# Author Info
author:
  name: *name
  bio: "Electronics tinkerer, cybersecurity adventurer, and space tech dreamer"

# Plugins (GitHub Pages-supported)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Footer - UPDATED keys to match layout usage
#footer_left: "© 2025 IndieSpaceViking"
#footer_right: "Privacy Policy"

# SEO & Sitemap
permalink: pretty
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      author: *name

# Exclude & Include
#exclude:
#  - README.md
#  - LICENSE
#  - Gemfile
#  - Gemfile.lock
#include:
#  - _pages
